<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D121B" />
      <stop offset="100%" stop-color="#0A151C" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 4px;
      fill: url(#titleGrad);
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #00D2FF;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #E2E8F0;
    }
  </style>

  <!-- Base Background -->
  <rect width="920" height="260" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle Grid -->
  <rect width="920" height="260" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="920" height="260" rx="16" fill="url(#cyanGlow)" />
  <rect width="920" height="260" rx="16" fill="url(#greenGlow)" />

  <!-- Background Decorative Candlesticks & Wave -->
  <g opacity="0.35">
    <!-- Candlestick Wicks & Bodies -->
    <line x1="560" y1="90" x2="560" y2="190" stroke="#10B981" stroke-width="1.5" />
    <rect x="555" y="115" width="10" height="50" rx="2" fill="#10B981" />

    <line x1="600" y1="120" x2="600" y2="210" stroke="#EF4444" stroke-width="1.5" />
    <rect x="595" y="140" width="10" height="45" rx="2" fill="#EF4444" />

    <line x1="640" y1="75" x2="640" y2="180" stroke="#10B981" stroke-width="1.5" />
    <rect x="635" y="90" width="10" height="60" rx="2" fill="#10B981" />

    <line x1="680" y1="85" x2="680" y2="195" stroke="#10B981" stroke-width="1.5" />
    <rect x="675" y="105" width="10" height="55" rx="2" fill="#10B981" />

    <line x1="720" y1="110" x2="720" y2="210" stroke="#EF4444" stroke-width="1.5" />
    <rect x="715" y="130" width="10" height="40" rx="2" fill="#EF4444" />

    <line x1="760" y1="60" x2="760" y2="170" stroke="#10B981" stroke-width="1.5" />
    <rect x="755" y="80" width="10" height="65" rx="2" fill="#10B981" />

    <line x1="800" y1="50" x2="800" y2="155" stroke="#10B981" stroke-width="1.5" />
    <rect x="795" y="65" width="10" height="55" rx="2" fill="#10B981" />

    <line x1="840" y1="40" x2="840" y2="140" stroke="#10B981" stroke-width="1.5" />
    <rect x="835" y="55" width="10" height="50" rx="2" fill="#10B981" />
  </g>

  <!-- Market Bullish Trend Line (Gradient Wave) -->
  <path d="M 480 210 Q 560 170 630 150 T 730 145 T 820 85 T 900 65 L 900 240 L 480 240 Z" fill="url(#chartFill)" />
  <path d="M 480 210 Q 560 170 630 150 T 730 145 T 820 85 T 900 65" fill="none" stroke="url(#chartGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Market Pulse Node / Beacon -->
  <circle cx="900" cy="65" r="5" fill="#10B981" />
  <circle cx="900" cy="65" r="10" fill="#10B981" fill-opacity="0.35" />

  <!-- Main Content Layout (Left Aligned) -->
  <g transform="translate(48, 52)">
    <!-- Sub-heading Tagline -->
    <text x="0" y="0" class="brand-sub">⚡ Digital Financial Media &amp; Intelligence</text>

    <!-- Main Brand Title -->
    <text x="0" y="56" class="brand-title">STOCKCRY</text>

    <!-- Description -->
    <text x="0" y="92" class="brand-desc">Real-Time Equities Analytics • Crypto On-Chain Intelligence • Quant AI Feeds</text>

    <!-- Interactive Badges Row -->
    <g transform="translate(0, 118)">
      <!-- Badge 1: Web Portal -->
      <g transform="translate(0, 0)">
        <rect width="180" height="30" rx="15" fill="#111827" stroke="#10B981" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#10B981" />
        <text x="30" y="19" class="badge-text">stockcry.pages.dev</text>
      </g>

      <!-- Badge 2: Lead Dev FIQTOR -->
      <g transform="translate(192, 0)">
        <rect width="190" height="30" rx="15" fill="#111827" stroke="#00D2FF" stroke-width="1.2" />
        <path d="M 12 15 C 12 11.5 14.5 9 18 9 C 21.5 9 24 11.5 24 15 C 24 17.8 22.3 20.2 19.8 20.8 L 19.8 19.5" fill="none" stroke="#00D2FF" stroke-width="1.5" />
        <text x="32" y="19" class="badge-text">Architect: @FIQTOR</text>
      </g>

      <!-- Badge 3: Market Coverage -->
      <g transform="translate(394, 0)">
        <rect width="195" height="30" rx="15" fill="#111827" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#F59E0B" />
        <text x="30" y="19" class="badge-text">Stock &amp; Crypto Markets</text>
      </g>
    </g>
  </g>
</svg>
